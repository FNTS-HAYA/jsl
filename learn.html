<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>学習モード — HANDIT!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    /* ===== ページタブ ===== */
    .page-tabs {
      display: flex; border-bottom: 2px solid var(--line);
      background: var(--white); position: sticky; top: 52px; z-index: 40;
    }
    .page-tab {
      flex: 1; padding: 14px; text-align: center;
      font-size: 14px; font-weight: 700; color: var(--ink-3);
      cursor: pointer; border: none; background: none;
      border-bottom: 3px solid transparent; margin-bottom: -2px;
      transition: color 0.15s, border-color 0.15s;
    }
    .page-tab.active { color: var(--ink); border-bottom-color: var(--yellow); }

    /* ===== マップ ===== */
    .map-wrap {
      max-width: 900px; margin: 0 auto;
      padding: 24px 20px 80px;
      display: flex; flex-direction: column; align-items: center;
    }
    .map-title { font-size: 20px; font-weight: 900; margin-bottom: 32px; align-self: flex-start; }
    .map-node-wrap { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .map-connector { width: 4px; height: 40px; background: var(--line); border-radius: 99px; }
    .map-connector.done { background: var(--yellow); }
    .map-node { display: flex; align-items: center; gap: 16px; width: 100%; cursor: pointer; position: relative; }
    .map-node.right { flex-direction: row-reverse; }
    .map-node.locked { cursor: not-allowed; }
    .map-circle {
      width: 72px; height: 72px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; flex-shrink: 0;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
      border: 3px solid transparent;
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative; z-index: 1;
    }
    .map-node:not(.locked):hover .map-circle { transform: scale(1.08); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
    .map-circle.available { background: var(--yellow); border-color: var(--yellow-d); }
    .map-circle.cleared   { background: var(--green);  border-color: var(--green-d); }
    .map-circle.locked    { background: #E0E0E0; border-color: #BDBDBD; }
    .map-stars { position: absolute; top: -8px; right: -8px; font-size: 14px; z-index: 2; }
    .map-label {
      flex: 1; background: white; border: 1.5px solid var(--line);
      border-radius: 14px; padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .map-label-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
    .map-label-words { font-size: 12px; color: var(--ink-3); }
    .map-label-badge {
      display: inline-block; margin-top: 6px;
      font-size: 11px; font-weight: 700; padding: 3px 10px;
      border-radius: 99px; background: var(--yellow-l);
      color: var(--yellow-d); border: 1px solid var(--yellow);
    }
    .map-label-badge.locked-badge  { background: #F0F0F0; color: var(--ink-3); border-color: var(--line); }
    .map-label-badge.cleared-badge { background: var(--green-l); color: var(--green-d); border-color: var(--green); }

    /* ===== PCマップ: 2カラム ===== */
    @media (min-width: 700px) {
      #level-map {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        width: 100%;
      }
      .map-node-wrap { width: 100%; }
      .map-connector { display: none; }
      .map-node { flex-direction: row !important; }
      .map-circle { width: 80px; height: 80px; font-size: 32px; }
      .map-label { padding: 16px 20px; }
      .map-label-title { font-size: 17px; }
      .map-wrap { max-width: 900px; }
    }

    /* ===== 図鑑 ===== */
    .dict-wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }
    .dict-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .dict-tab {
      padding: 7px 14px; border-radius: 99px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      background: var(--white); border: 1.5px solid var(--line);
      color: var(--ink-3); transition: all 0.15s;
    }
    .dict-tab.active { background: var(--yellow); border-color: var(--yellow-d); color: var(--ink); }
    .dict-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    .dict-card {
      background: var(--white); border: 1.5px solid var(--line);
      border-radius: var(--radius); overflow: hidden;
      box-shadow: var(--shadow); cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .dict-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .dict-thumb {
      background: #111; aspect-ratio: 4/3;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    .dict-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .dict-thumb-ph { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #444; }
    .dict-thumb-ph span:first-child { font-size: 28px; }
    .dict-thumb-ph span:last-child  { font-size: 11px; }
    .dict-play {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.3); font-size: 28px;
      opacity: 0; transition: opacity 0.15s;
    }
    .dict-card:hover .dict-play { opacity: 1; }
    .dict-card-body { padding: 10px 12px; }
    .dict-word { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
    .dict-cat  { font-size: 11px; color: var(--ink-3); }

    /* ===== 図鑑モーダル ===== */
    .dict-modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; padding: 20px;
    }
    .dict-modal-overlay.hidden { display: none; }
    .dict-modal {
      background: var(--white); border-radius: 24px;
      width: 100%; max-width: 480px; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .dict-modal-video {
      background: #111; aspect-ratio: 16/9;
      display: flex; align-items: center; justify-content: center;
    }
    .dict-modal-video video { width: 100%; height: 100%; object-fit: cover; }
    .dict-modal-ph { display: flex; flex-direction: column; align-items: center; gap: 10px; color: #555; font-size: 14px; }
    .dict-modal-body { padding: 20px 22px 24px; }
    .dict-modal-word { font-size: 28px; font-weight: 900; margin-bottom: 4px; }
    .dict-modal-cat  { font-size: 12px; color: var(--ink-3); font-weight: 600; margin-bottom: 10px; }
    .dict-modal-desc { font-size: 14px; color: var(--ink-2); line-height: 1.7; margin-bottom: 16px; }
    .dict-modal-close {
      width: 100%; padding: 12px; background: var(--line);
      border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
      cursor: pointer; color: var(--ink-2);
    }

    /* ===== レッスン画面 ===== */
    @media (min-width: 700px) {
      .ls-body {
        flex-direction: row;
        align-items: flex-start;
        gap: 32px;
      }
      .ls-body-left {
        flex: 1;
        display: flex; flex-direction: column; gap: 14px;
      }
      .ls-body-right {
        flex: 1;
        display: flex; flex-direction: column; gap: 14px;
      }
      .ls-prompt-word { font-size: 56px; }
    }
    /* PC: 参考動画とカメラを横並び */
    .lesson-media {
      display: flex; gap: 12px; width: 100%;
    }
    .lesson-media .video-space { flex: 1; aspect-ratio: 4/3; }
    .lesson-media .camera-wrap { flex: 1; }

    /* スマホ: タブで切り替え */
    .media-tabs {
      display: none;
      border-radius: var(--radius); overflow: hidden;
      border: 1.5px solid var(--line);
    }
    .media-tab-btns {
      display: flex; background: var(--line);
    }
    .media-tab-btn {
      flex: 1; padding: 10px; text-align: center;
      font-size: 13px; font-weight: 700; color: var(--ink-3);
      cursor: pointer; border: none; background: none;
      transition: all 0.15s;
    }
    .media-tab-btn.active { background: var(--white); color: var(--ink); }
    .media-tab-content { display: none; }
    .media-tab-content.active { display: block; }

    @media (max-width: 560px) {
      .lesson-media { display: none; }
      .media-tabs   { display: block; }
    }

    /* ページコンテンツ切り替え */
    .page-content { display: none; }
    .page-content.active { display: block; }

    /* ===== データ収集同意バナー ===== */
    .consent-banner {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      background: #1A1A1A; border-top: 1px solid #2A2A2A;
      padding: 16px 20px;
      display: flex; flex-direction: column; gap: 10px;
      transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    .consent-banner.show { transform: translateY(0); }
    .consent-banner.hidden-banner { display: none; }
    .consent-title { font-size: 14px; font-weight: 700; color: white; }
    .consent-body  { font-size: 12px; color: rgba(255,255,255,0.5); line-height: 1.6; }
    .consent-btns  { display: flex; gap: 10px; }
    .consent-agree {
      flex: 1; padding: 11px; background: var(--yellow); color: var(--ink);
      border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700;
      cursor: pointer;
    }
    .consent-deny {
      padding: 11px 20px; background: none; color: rgba(255,255,255,0.4);
      border: 1px solid #333; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- データ収集同意バナー -->
<div class="consent-banner" id="consent-banner">
  <div class="consent-title">🤝 データ収集にご協力ください</div>

  <div class="consent-btns">

</div>

<div class="loading-overlay" id="loading">

</div>

<!-- 図鑑モーダル -->
<div class="dict-modal-overlay hidden" id="dict-modal">
  <div class="dict-modal">
    <div class="dict-modal-video" id="modal-video-wrap">
      <div class="dict-modal-ph"><span style="font-size:40px;">🎬</span><span>動画準備中</span></div>
    </div>
    <div class="dict-modal-body">
      <div class="dict-modal-word" id="modal-word">—</div>

      <button class="dict-modal-close" id="modal-close">閉じる</button>
    </div>
  </div>
</div>

<nav class="topbar">
  <img src="handit_logo.png" alt="HANDIT!" class="topbar-logo"/>
  <a href="index.html" class="topbar-link">← ホーム</a>
</nav>

<!-- ページタブ -->
<div class="page-tabs" id="page-tabs-bar">
  <button class="page-tab active" data-page="map">📚 学習マップ</button>
  <button class="page-tab"        data-page="dict">📖 手話図鑑</button>
</div>

<!-- ===== 学習マップ ===== -->
<div class="page-content active" id="page-map">
  <div class="map-wrap">
    <div id="level-map"></div>
  </div>
</div>

<!-- ===== 手話図鑑 ===== -->
<div class="page-content" id="page-dict">
  <div class="dict-wrap">
    <div class="dict-tabs" id="dict-tabs"></div>
    <div class="dict-grid" id="dict-grid"></div>
  </div>
</div>

<!-- ===== レッスン画面 ===== -->
<div class="lesson-screen" id="view-lesson">
  <div class="ls-header">
    <button class="ls-back" id="back-lesson">✕</button>
    <div class="ls-progress-wrap">
      <div class="ls-progress-bar" id="ls-progress" style="width:0%"></div>
    </div>
    <div class="ls-phase-label" id="ls-phase-label">学習</div>
  </div>
  <div class="ls-body">

    <!-- お題 -->
    <div class="ls-prompt">

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.3/dist/ort.min.js"></script>

<script>
// ===================================================
// 単語・レベルを追加するときはここを編集
// ===================================================
const LEVELS = [
  { id:1, title:'あいさつ', icon:'👋', color:'#FFFBDD', words:['おはよう','こんにちは','ありがとう'], videos:{} },
  { id:2, title:'きもち',   icon:'❤️', color:'#FFECEC', words:['好き','嫌い'],                       videos:{} },
  { id:3, title:'フレーズ', icon:'💬', color:'#E8F1FC', words:['もう一度'],                          videos:{} },
];

// 手話図鑑データ（動画を追加するときはvideoにパスを書く）
const DICTIONARY = [
  { word:'おはよう',     cat:'あいさつ', gif:null, desc:'右手をグーにして額の横に当て、前方へ下げる動作。' },
  { word:'こんにちは',   cat:'あいさつ', gif:null, desc:'人差し指と中指を額に当て、前方へ下げる動作。' },
  { word:'ありがとう',   cat:'あいさつ', gif:null, desc:'右手を胸の前に出し、前方へ傾ける動作。' },
  { word:'好き',         cat:'きもち',   gif:null, desc:'胸の前で右手をグーにして、ハートを作るように動かす。' },
  { word:'嫌い',         cat:'きもち',   gif:null, desc:'手を払うように外側へ振る動作。' },
  { word:'もう一度',     cat:'会話',     gif:null, desc:'片手を上下に動かして「繰り返す」を表現する。' },
  { word:'わかりました', cat:'会話',     gif:null, desc:'右手を額の横から前方に開く動作。' },
  { word:'ゆっくり',     cat:'会話',     gif:null, desc:'両手をゆっくり前方に押し出す動作。' },
  { word:'私',           cat:'自己紹介', gif:null, desc:'右手の人差し指で自分の胸を指す。' },
  { word:'名前',         cat:'自己紹介', gif:null, desc:'両手の人差し指を交差させる動作。' },
];

const MODEL_PATH     = 'dataset/model_single.onnx';
const LABELS_PATH    = 'dataset/labels.json';
const TARGET_FRAMES  = 64;
const CONF_THRESHOLD = 0.70;
const HOLD_FRAMES    = 15;
const FACE_KEYS      = ['nose','forehead','chin','left_eye','right_eye','mouth'];
const FACE_POINTS    = { nose:1, forehead:10, chin:152, left_eye:33, right_eye:263, mouth:13 };

let ort_session=null, labels=[], frameBuffer=[], currentHandsData={}, currentFaceData=null;
let handsDetector=null, faceMesh=null, mpCam=null, inferring=false;
const PHASE = { LEARN:'learn', REVIEW:'review' };
let currentPhase=PHASE.LEARN, currentLevel=null;
let learnQueue=[], reviewQueue=[], currentChallenge=null, currentIdx=0;
let correctCount=0, answered=false, holdCount=0;

// スマホ判定
function isMobile() { return window.innerWidth <= 560; }

function getClearedLevels(){ return JSON.parse(localStorage.getItem('handit_cleared')||'[]'); }
function setClearedLevel(id){ const c=getClearedLevels();if(!c.includes(id)){c.push(id);localStorage.setItem('handit_cleared',JSON.stringify(c));} }

// ===== ページタブ =====
document.querySelectorAll('.page-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.page-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('page-' + btn.dataset.page).classList.add('active');
  });
});

// ===== スマホ メディアタブ =====
document.querySelectorAll('.media-tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.media-tab-btn').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.media-tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ===== マップ構築 =====
function buildLevelList() {
  const cleared=getClearedLevels();
  const map=document.getElementById('level-map');
  map.innerHTML='';
  LEVELS.forEach((level,i)=>{
    const isCleared=cleared.includes(level.id);
    const isAvailable=i===0||cleared.includes(LEVELS[i-1].id);
    const hasWords=level.words.every(w=>labels.includes(w));
    const canPlay=isAvailable&&hasWords;
    const isRight=i%2===1;
    const wrap=document.createElement('div');
    wrap.className='map-node-wrap';
    if(i>0){
      const conn=document.createElement('div');
      conn.className='map-connector'+(isCleared?' done':'');
      wrap.appendChild(conn);
    }
    const node=document.createElement('div');
    node.className='map-node'+(isRight?' right':'')+(canPlay?'':' locked');
    const state=isCleared?'cleared':canPlay?'available':'locked';
    const badge=isCleared?'✅ クリア済み':canPlay?'スタート':'🔒 ロック中';
    const bc=isCleared?'cleared-badge':canPlay?'':'locked-badge';
    node.innerHTML=`
      <div class="map-circle ${state}">${level.icon}${isCleared?'<div class="map-stars">⭐</div>':''}</div>
      <div class="map-label">
        <div class="map-label-title">Lv.${level.id} ${level.title}</div>
        <div class="map-label-words">${level.words.join(' · ')}</div>
        <span class="map-label-badge ${bc}">${badge}</span>
      </div>`;
    if(canPlay) node.addEventListener('click',()=>startLesson(level));
    wrap.appendChild(node);
    map.appendChild(wrap);
  });
}

// ===== 図鑑構築 =====
const DICT_CATS = ['すべて', ...new Set(DICTIONARY.map(d=>d.cat))];
let currentDictCat = 'すべて';

function buildDictTabs() {
  const tabs=document.getElementById('dict-tabs');
  DICT_CATS.forEach(cat=>{
    const btn=document.createElement('button');
    btn.className='dict-tab'+(cat===currentDictCat?' active':'');
    btn.textContent=cat;
    btn.addEventListener('click',()=>{
      currentDictCat=cat;
      document.querySelectorAll('.dict-tab').forEach(t=>t.classList.remove('active'));
      btn.classList.add('active');
      buildDictGrid();
    });
    tabs.appendChild(btn);
  });
}

function buildDictGrid() {
  const grid=document.getElementById('dict-grid');
  grid.innerHTML='';
  const items=currentDictCat==='すべて'?DICTIONARY:DICTIONARY.filter(d=>d.cat===currentDictCat);
  items.forEach(item=>{
    const card=document.createElement('div');
    card.className='dict-card';
    card.innerHTML=`
      <div class="dict-thumb">
        ${item.gif
          ?`<img src="${item.gif}" alt="${item.word}" style="width:100%;height:100%;object-fit:cover;display:block;"/>`
          :`<div class="dict-thumb-ph"><span>🤟</span><span>準備中</span></div>`}
      </div>
      <div class="dict-card-body">
        <div class="dict-word">${item.word}</div>
        <div class="dict-cat">${item.cat}</div>
      </div>`;
    card.addEventListener('click',()=>openDictModal(item));
    grid.appendChild(card);
  });
}

function openDictModal(item) {
  document.getElementById('modal-word').textContent=item.word;
  document.getElementById('modal-cat').textContent=item.cat;
  document.getElementById('modal-desc').textContent=item.desc||'説明準備中';
  const wrap=document.getElementById('modal-video-wrap');
  wrap.innerHTML=item.gif
    ?`<img src="${item.gif}" alt="${item.word}" style="width:100%;height:100%;object-fit:cover;display:block;"/>`
    :`<div class="dict-modal-ph"><span style="font-size:40px;">🤟</span><span>GIF準備中</span></div>`;
  document.getElementById('dict-modal').classList.remove('hidden');
}

document.getElementById('modal-close').addEventListener('click',()=>{
  document.getElementById('dict-modal').classList.add('hidden');
  const v=document.querySelector('#modal-video-wrap video');if(v)v.pause();
});
document.getElementById('dict-modal').addEventListener('click',function(e){
  if(e.target===this){this.classList.add('hidden');const v=document.querySelector('#modal-video-wrap video');if(v)v.pause();}
});

// ===== 初期化 =====
async function init() {
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('loading-text').textContent='モデルを読み込み中...';
  try {
    ort.env.wasm.wasmPaths='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.3/dist/';
    ort_session=await ort.InferenceSession.create(MODEL_PATH);
    const ld=await fetch(LABELS_PATH).then(r=>r.json());
    labels=ld.labels;
  } catch(e) {
    document.getElementById('loading-text').textContent='モデルの読み込みに失敗しました。';
    console.error(e); return;
  }
  document.getElementById('loading-text').textContent='MediaPipeを初期化中...';
  handsDetector=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/'+f});
  handsDetector.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:0.65,minTrackingConfidence:0.5});
  handsDetector.onResults(onHandResults);
  faceMesh=new FaceMesh({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/'+f});
  faceMesh.setOptions({maxNumFaces:1,refineLandmarks:false,minDetectionConfidence:0.5,minTrackingConfidence:0.5});
  faceMesh.onResults(onFaceResults);
  buildLevelList();
  buildDictTabs();
  buildDictGrid();
  document.getElementById('loading').classList.add('hidden');
}

// ===== カメラ =====
async function startCam() {
  const mobile=isMobile();
  const vid=mobile?'video-lesson-sp':'video-lesson';
  const cid=mobile?'canvas-lesson-sp':'canvas-lesson';
  const video=document.getElementById(vid);
  const canvas=document.getElementById(cid);
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
  video.srcObject=stream;
  await new Promise(r=>video.onloadedmetadata=r);
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  let fc=0;
  mpCam=new Camera(video,{
    onFrame:async()=>{fc++;await handsDetector.send({image:video});if(fc%2===0)await faceMesh.send({image:video});},
    width:640,height:480
  });
  mpCam.start();
}

function stopCam() {
  if(mpCam){mpCam.stop();mpCam=null;}
  ['video-lesson','video-lesson-sp'].forEach(id=>{
    const v=document.getElementById(id);
    if(v&&v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null;}
  });
  frameBuffer=[];holdCount=0;inferring=false;currentHandsData={};currentFaceData=null;
}

// ===== MediaPipe =====
function onFaceResults(r){
  if(!r.multiFaceLandmarks||!r.multiFaceLandmarks.length){currentFaceData=null;return;}
  const lm=r.multiFaceLandmarks[0];currentFaceData={};
  for(const k in FACE_POINTS){const i=FACE_POINTS[k];currentFaceData[k]={x:lm[i].x,y:lm[i].y,z:lm[i].z};}
}

function onHandResults(r) {
  if(!document.getElementById('view-lesson').classList.contains('active'))return;
  const mobile=isMobile();
  const cid=mobile?'canvas-lesson-sp':'canvas-lesson';
  const canvas=document.getElementById(cid);if(!canvas)return;
  const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);
  currentHandsData={};
  if(!r.multiHandLandmarks||!r.multiHandLandmarks.length){frameBuffer=[];holdCount=0;return;}
  for(let i=0;i<r.multiHandLandmarks.length;i++){
    const lm=r.multiHandLandmarks[i],side=r.multiHandedness[i].label;
    currentHandsData[side]=lm;
    drawConnectors(ctx,lm,HAND_CONNECTIONS,{color:'rgba(255,255,255,0.3)',lineWidth:2});
    drawLandmarks(ctx,lm,{color:side==='Right'?'#FFD60A':'#CE82FF',lineWidth:1,radius:3});
  }
  if(currentFaceData)FACE_KEYS.forEach(k=>{const p=currentFaceData[k];if(!p)return;ctx.beginPath();ctx.arc(p.x*canvas.width,p.y*canvas.height,4,0,Math.PI*2);ctx.fillStyle='#0071E3';ctx.fill();});
  frameBuffer.push(buildVec());
  if(frameBuffer.length>TARGET_FRAMES)frameBuffer.shift();
  if(frameBuffer.length===TARGET_FRAMES&&!answered)runInfer();
}

// ===== 特徴量 =====
function handVec(lm){const v=[];for(const p of lm)v.push(p.x,p.y,p.z);const w=lm[0],m=lm[9],dx=m.x-w.x,dy=m.y-w.y,dz=m.z-w.z;const dl=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;v.push(dx/dl,dy/dl,dz/dl);const p0=lm[0],p1=lm[5],p2=lm[17];const u=[p1.x-p0.x,p1.y-p0.y,p1.z-p0.z],t=[p2.x-p0.x,p2.y-p0.y,p2.z-p0.z];const nx=u[1]*t[2]-u[2]*t[1],ny=u[2]*t[0]-u[0]*t[2],nz=u[0]*t[1]-u[1]*t[0];const nl=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;v.push(nx/nl,ny/nl,nz/nl);return v;}
function distVec(lm,face){const w=lm[0];return FACE_KEYS.map(k=>{if(!face||!face[k])return 0;const p=face[k],dx=w.x-p.x,dy=w.y-p.y,dz=w.z-p.z;return Math.sqrt(dx*dx+dy*dy+dz*dz);});}
function buildVec(){const Z69=new Array(69).fill(0),Z6=new Array(6).fill(0),Z18=new Array(18).fill(0);const r=currentHandsData['Right']?handVec(currentHandsData['Right']):Z69.slice();const l=currentHandsData['Left']?handVec(currentHandsData['Left']):Z69.slice();let fv=Z18.slice();if(currentFaceData)FACE_KEYS.forEach((k,i)=>{const p=currentFaceData[k];if(p){fv[i*3]=p.x;fv[i*3+1]=p.y;fv[i*3+2]=p.z;}});const rd=currentHandsData['Right']?distVec(currentHandsData['Right'],currentFaceData):Z6.slice();const ld=currentHandsData['Left']?distVec(currentHandsData['Left'],currentFaceData):Z6.slice();return [...r,...l,...fv,...rd,...ld];}

// ===== 推論 =====
async function runInfer(){
  if(inferring)return;inferring=true;
  const t=new ort.Tensor('float32',Float32Array.from(frameBuffer.flat()),[1,TARGET_FRAMES,168]);
  try{
    const out=await ort_session.run({input:t});
    const lg=Array.from(out.output.data);
    const mx=Math.max(...lg);const ex=lg.map(v=>Math.exp(v-mx));const sm=ex.reduce((a,b)=>a+b,0);const pb=ex.map(v=>v/sm);
    const i=pb.indexOf(Math.max(...pb));const label=labels[i],conf=pb[i];
    const ok=label===currentChallenge&&conf>=CONF_THRESHOLD;
    document.getElementById('lesson-dot').className='detect-dot'+(conf>=CONF_THRESHOLD?(ok?' active':' wrong'):'');
    document.getElementById('lesson-label').textContent=conf>=0.35?label:'手をカメラに向けてください';
    document.getElementById('lesson-conf').textContent=conf>=0.35?Math.round(conf*100)+'%':'';
    document.getElementById('hold-fill').style.width=(holdCount/HOLD_FRAMES*100)+'%';
    if(ok){holdCount++;if(holdCount>=HOLD_FRAMES){
      answered=true;correctCount++;showFeedback(true);
      // 正解サンプルをDriveに送信
      uploadToDrive(currentChallenge, [...frameBuffer]);
    }}
    else holdCount=0;
  }catch(e){console.error(e);}
  inferring=false;
}

// ===== レッスン =====
async function startLesson(level){
  currentLevel=level;currentPhase=PHASE.LEARN;correctCount=0;answered=false;holdCount=0;
  learnQueue=[...level.words];
  reviewQueue=[...level.words,...level.words].sort(()=>Math.random()-0.5);
  currentIdx=0;
  showView('view-lesson');
  await startCam();
  nextChallenge();
}

function nextChallenge(){
  const queue=currentPhase===PHASE.LEARN?learnQueue:reviewQueue;
  if(currentIdx>=queue.length){
    if(currentPhase===PHASE.LEARN){
      currentPhase=PHASE.REVIEW;currentIdx=0;correctCount=0;
      document.getElementById('ls-phase-label').textContent='復習';
      document.getElementById('ls-prompt-label').textContent='復習テスト';
      nextChallenge();return;
    }else{endLesson();return;}
  }
  currentChallenge=queue[currentIdx];answered=false;holdCount=0;frameBuffer=[];
  document.getElementById('challenge-word').textContent=currentChallenge;
  document.getElementById('lesson-dot').className='detect-dot';
  document.getElementById('lesson-label').textContent='手をカメラに向けてください';
  document.getElementById('lesson-conf').textContent='';
  document.getElementById('hold-fill').style.width='0%';
  document.getElementById('ls-progress').style.width=(currentIdx/(currentPhase===PHASE.LEARN?learnQueue.length:reviewQueue.length)*100)+'%';
  document.getElementById('ls-phase-label').textContent=currentPhase===PHASE.LEARN?'学習':'復習';
  // 参考動画更新
  const src=currentLevel.videos&&currentLevel.videos[currentChallenge];
  ['pc','sp'].forEach(suffix=>{
    const rv=document.getElementById('ref-video-'+suffix);
    const ph=document.getElementById('video-placeholder-'+suffix);
    if(src){
      // GIFの場合はimgタグに差し替え
      if(src.endsWith('.gif')){
        const container=rv.parentElement;
        if(!container.querySelector('img.ref-gif')){
          const img=document.createElement('img');
          img.className='ref-gif';
          img.style.cssText='width:100%;height:100%;object-fit:cover;display:block;position:absolute;top:0;left:0;';
          container.appendChild(img);
        }
        const img=container.querySelector('img.ref-gif');
        img.src=src; img.style.display='block';
        rv.style.display='none';
      } else {
        rv.src=src;rv.style.display='block';rv.load();
        const img=rv.parentElement.querySelector('img.ref-gif');
        if(img)img.style.display='none';
      }
      if(ph)ph.style.display='none';
    } else {
      rv.style.display='none';
      const img=rv.parentElement&&rv.parentElement.querySelector('img.ref-gif');
      if(img)img.style.display='none';
      if(ph)ph.style.display='flex';
    }
  });
  currentIdx++;
}

function showFeedback(correct){
  const fb=document.getElementById('feedback');
  fb.className='feedback-overlay show '+(correct?'correct':'wrong');
  document.getElementById('fb-title').textContent=correct?'正解！ 🎉':'もう一度！ 💪';
  document.getElementById('fb-sub').textContent=correct?`「${currentChallenge}」できました！`:`「${currentChallenge}」をもう一度`;
}

async function endLesson(){
  stopCam();
  const xp=correctCount*10;
  if(currentLevel)setClearedLevel(currentLevel.id);
  const stored=parseInt(localStorage.getItem('handit_xp')||'0');
  localStorage.setItem('handit_xp',stored+xp);
  document.getElementById('c-correct').textContent=correctCount;
  document.getElementById('c-xp').textContent='+'+xp;
  document.getElementById('complete-sub').textContent=`復習テスト ${reviewQueue.length}問中${correctCount}問正解！`;
  showView('view-complete');
}

function showView(id){
  document.getElementById('page-map').classList.remove('active');
  document.getElementById('page-dict').classList.remove('active');
  document.getElementById('page-tabs-bar').style.display=id==='view-lesson'||id==='view-complete'?'none':'flex';
  ['view-lesson','view-complete'].forEach(v=>{
    const el=document.getElementById(v);if(el)el.classList.toggle('active',v===id);
  });
}

function goBack(){
  stopCam();
  document.getElementById('feedback').className='feedback-overlay';
  document.getElementById('page-tabs-bar').style.display='flex';
  document.getElementById('page-map').classList.add('active');
  document.getElementById('view-lesson').classList.remove('active');
  document.getElementById('view-complete').classList.remove('active');
  buildLevelList();
}

document.getElementById('back-lesson').addEventListener('click', goBack);
document.getElementById('fb-btn').addEventListener('click',()=>{
  document.getElementById('feedback').className='feedback-overlay';
  answered=false;holdCount=0;frameBuffer=[];nextChallenge();
});
document.getElementById('complete-back-btn').addEventListener('click',e=>{
  e.preventDefault();goBack();
});

init();

// ===== データ収集設定 =====
const CLIENT_ID   = '464113009637-0f2l188sn3poh4cahp6n8kk1kfgl39ss.apps.googleusercontent.com';
const FOLDER_ID   = '1yqW3nGPTje6UKJfHHVI1BZlMDCmuZWBY';
const CONSENT_KEY = 'handit_data_consent';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';

let accessToken  = null;
let dataConsent  = localStorage.getItem(CONSENT_KEY); // 'agree' | 'deny' | null

// 同意バナー表示
function initConsent() {
  if (dataConsent !== null) return; // 既に選択済み
  setTimeout(() => {
    document.getElementById('consent-banner').classList.add('show');
  }, 2000);
}

document.getElementById('consent-agree-btn').addEventListener('click', async () => {
  localStorage.setItem(CONSENT_KEY, 'agree');
  dataConsent = 'agree';
  document.getElementById('consent-banner').classList.remove('show');
  await signInGoogle();
});

document.getElementById('consent-deny-btn').addEventListener('click', () => {
  localStorage.setItem(CONSENT_KEY, 'deny');
  dataConsent = 'deny';
  document.getElementById('consent-banner').classList.remove('show');
});

// Google OAuth サインイン
async function signInGoogle() {
  return new Promise((resolve) => {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: (resp) => {
        if (resp.access_token) {
          accessToken = resp.access_token;
          console.log('Google Drive連携完了');
        }
        resolve();
      },
    });
    client.requestAccessToken({ prompt: 'consent' });
  });
}

// Google Driveにアップロード
async function uploadToDrive(label, frameData) {
  if (dataConsent !== 'agree') return;
  if (!accessToken) {
    await signInGoogle();
    if (!accessToken) return;
  }
  try {
    const data = {
      label,
      frameCount: frameData.length,
      frames: frameData,
      timestamp: Date.now(),
      userAgent: navigator.userAgent.substring(0, 50),
    };
    const blob     = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const filename = `sample_${label}_${Date.now()}.json`;
    const metadata = { name: filename, parents: [FOLDER_ID] };
    const form     = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    form.append('file', blob);
    const resp = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: { Authorization: `Bearer ${accessToken}` },
      body: form,
    });
    if (resp.ok) console.log(`サンプル送信: ${filename}`);
  } catch(e) {
    console.error('Drive upload error:', e);
    accessToken = null; // トークンリセット
  }
}

initConsent();
