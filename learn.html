<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>学習モード — HANDIT!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .map-wrap {
      max-width: 400px; margin: 0 auto;
      padding: 24px 20px 80px;
      display: flex; flex-direction: column; align-items: center;
    }
    .map-title { font-size: 20px; font-weight: 900; margin-bottom: 32px; align-self: flex-start; }
    .map-node-wrap { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .map-connector { width: 4px; height: 40px; background: var(--line); border-radius: 99px; }
    .map-connector.done { background: var(--yellow); }
    .map-node { display: flex; align-items: center; gap: 16px; width: 100%; cursor: pointer; position: relative; }
    .map-node.right { flex-direction: row-reverse; }
    .map-node.locked { cursor: not-allowed; }
    .map-circle {
      width: 72px; height: 72px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; flex-shrink: 0;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
      border: 3px solid transparent;
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative; z-index: 1;
    }
    .map-node:not(.locked):hover .map-circle { transform: scale(1.08); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
    .map-circle.available { background: var(--yellow); border-color: var(--yellow-d); }
    .map-circle.cleared   { background: var(--green);  border-color: var(--green-d); }
    .map-circle.locked    { background: #E0E0E0; border-color: #BDBDBD; }
    .map-stars { position: absolute; top: -8px; right: -8px; font-size: 14px; z-index: 2; }
    .map-label {
      flex: 1; background: white; border: 1.5px solid var(--line);
      border-radius: 14px; padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .map-label-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
    .map-label-words { font-size: 12px; color: var(--ink-3); }
    .map-label-badge {
      display: inline-block; margin-top: 6px;
      font-size: 11px; font-weight: 700; padding: 3px 10px;
      border-radius: 99px; background: var(--yellow-l);
      color: var(--yellow-d); border: 1px solid var(--yellow);
    }
    .map-label-badge.locked-badge  { background: #F0F0F0; color: var(--ink-3); border-color: var(--line); }
    .map-label-badge.cleared-badge { background: var(--green-l); color: var(--green-d); border-color: var(--green); }
  </style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loading-text">モデルを読み込み中...</div>
</div>

<nav class="topbar">
  <img src="handit_logo.png" alt="HANDIT!" class="topbar-logo"/>
  <a href="index.html" class="topbar-link">← ホーム</a>
</nav>

<div id="view-levels">
  <div class="map-wrap">
    <div class="map-title">📚 学習マップ</div>
    <div id="level-map"></div>
  </div>
</div>

<div class="lesson-screen" id="view-lesson">
  <div class="ls-header">
    <button class="ls-back" id="back-lesson">✕</button>
    <div class="ls-progress-wrap">
      <div class="ls-progress-bar" id="ls-progress" style="width:0%"></div>
    </div>
    <div class="ls-phase-label" id="ls-phase-label">学習</div>
  </div>
  <div class="ls-body">
    <div class="video-space" id="video-space">
      <video id="ref-video" controls style="display:none;width:100%;height:100%;object-fit:cover;"></video>
      <div class="video-placeholder" id="video-placeholder">
        <div class="video-placeholder-icon">🎬</div>
        <div class="video-placeholder-text">参考動画</div>
      </div>
    </div>
    <div class="ls-prompt">
      <div class="ls-prompt-label" id="ls-prompt-label">この手話をやってみよう</div>
      <div class="ls-prompt-word" id="challenge-word">—</div>
    </div>
    <div class="camera-wrap">
      <video id="video-lesson" autoplay playsinline muted></video>
      <canvas id="canvas-lesson"></canvas>
    </div>
    <div class="hold-track"><div class="hold-fill" id="hold-fill"></div></div>
    <div class="detect-bar">
      <div class="detect-dot" id="lesson-dot"></div>
      <div class="detect-label" id="lesson-label">手をカメラに向けてください</div>
      <div class="detect-conf"  id="lesson-conf"></div>
    </div>
  </div>
</div>

<div class="complete-screen" id="view-complete">
  <div class="complete-emoji">🎉</div>
  <div class="complete-title">レベルクリア！</div>
  <div class="complete-sub" id="complete-sub"></div>
  <div class="complete-stats">
    <div class="complete-stat">
      <div class="complete-stat-num" id="c-correct">0</div>
      <div class="complete-stat-label">正解</div>
    </div>
    <div class="complete-stat">
      <div class="complete-stat-num" id="c-xp">+0</div>
      <div class="complete-stat-label">XP獲得</div>
    </div>
  </div>
  <a href="#" class="complete-home-btn" id="complete-back-btn">マップに戻る</a>
</div>

<div class="feedback-overlay" id="feedback">
  <div class="feedback-title" id="fb-title"></div>
  <div class="feedback-sub"   id="fb-sub"></div>
  <button class="feedback-btn" id="fb-btn">つぎへ</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.3/dist/ort.min.js"></script>

<script>
// ===== LEVELS定義（app.jsと同じ内容） =====
const LEVELS = [
  { id:1, title:'あいさつ', icon:'👋', color:'#FFFBDD', words:['おはよう','こんにちは','ありがとう'], videos:{} },
  { id:2, title:'きもち',   icon:'❤️', color:'#FFECEC', words:['好き','嫌い'],                       videos:{} },
  { id:3, title:'フレーズ', icon:'💬', color:'#E8F1FC', words:['もう一度'],                          videos:{} },
];

const MODEL_PATH     = 'dataset/model_single.onnx';
const LABELS_PATH    = 'dataset/labels.json';
const TARGET_FRAMES  = 64;
const CONF_THRESHOLD = 0.70;
const HOLD_FRAMES    = 15;
const FACE_KEYS      = ['nose','forehead','chin','left_eye','right_eye','mouth'];
const FACE_POINTS    = { nose:1, forehead:10, chin:152, left_eye:33, right_eye:263, mouth:13 };

let ort_session=null, labels=[], frameBuffer=[], currentHandsData={}, currentFaceData=null;
let handsDetector=null, faceMesh=null, mpCam=null, inferring=false;
const PHASE = { LEARN:'learn', REVIEW:'review' };
let currentPhase=PHASE.LEARN, currentLevel=null;
let learnQueue=[], reviewQueue=[], currentChallenge=null, currentIdx=0;
let correctCount=0, answered=false, holdCount=0;

function getClearedLevels(){ return JSON.parse(localStorage.getItem('handit_cleared')||'[]'); }
function setClearedLevel(id){ const c=getClearedLevels(); if(!c.includes(id)){c.push(id);localStorage.setItem('handit_cleared',JSON.stringify(c));} }

// ===== マップ構築 =====
function buildLevelList() {
  const cleared=getClearedLevels();
  const map=document.getElementById('level-map');
  map.innerHTML='';
  LEVELS.forEach((level,i)=>{
    const isCleared=cleared.includes(level.id);
    const isAvailable=i===0||cleared.includes(LEVELS[i-1].id);
    const hasWords=level.words.every(w=>labels.includes(w));
    const canPlay=isAvailable&&hasWords;
    const isRight=i%2===1;
    const wrap=document.createElement('div');
    wrap.className='map-node-wrap';
    if(i>0){
      const conn=document.createElement('div');
      conn.className='map-connector'+(isCleared?' done':'');
      wrap.appendChild(conn);
    }
    const node=document.createElement('div');
    node.className='map-node'+(isRight?' right':'')+(canPlay?'':' locked');
    const state=isCleared?'cleared':canPlay?'available':'locked';
    const badge=isCleared?'✅ クリア済み':canPlay?'スタート':'🔒 ロック中';
    const bc=isCleared?'cleared-badge':canPlay?'':'locked-badge';
    node.innerHTML=`
      <div class="map-circle ${state}">${level.icon}${isCleared?'<div class="map-stars">⭐</div>':''}</div>
      <div class="map-label">
        <div class="map-label-title">Lv.${level.id} ${level.title}</div>
        <div class="map-label-words">${level.words.join(' · ')}</div>
        <span class="map-label-badge ${bc}">${badge}</span>
      </div>`;
    if(canPlay) node.addEventListener('click',()=>startLesson(level));
    wrap.appendChild(node);
    map.appendChild(wrap);
  });
}

// ===== 初期化 =====
async function init() {
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('loading-text').textContent='モデルを読み込み中...';
  try {
    ort.env.wasm.wasmPaths='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.3/dist/';
    ort_session=await ort.InferenceSession.create(MODEL_PATH);
    const ld=await fetch(LABELS_PATH).then(r=>r.json());
    labels=ld.labels;
  } catch(e) {
    document.getElementById('loading-text').textContent='モデルの読み込みに失敗しました。';
    console.error(e); return;
  }
  document.getElementById('loading-text').textContent='MediaPipeを初期化中...';
  handsDetector=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/'+f});
  handsDetector.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:0.65,minTrackingConfidence:0.5});
  handsDetector.onResults(onHandResults);
  faceMesh=new FaceMesh({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/'+f});
  faceMesh.setOptions({maxNumFaces:1,refineLandmarks:false,minDetectionConfidence:0.5,minTrackingConfidence:0.5});
  faceMesh.onResults(onFaceResults);
  buildLevelList();
  document.getElementById('loading').classList.add('hidden');
}

// ===== カメラ =====
async function startCam(vid,cid){
  const video=document.getElementById(vid), canvas=document.getElementById(cid);
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
  video.srcObject=stream;
  await new Promise(r=>video.onloadedmetadata=r);
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  let fc=0;
  mpCam=new Camera(video,{onFrame:async()=>{fc++;await handsDetector.send({image:video});if(fc%2===0)await faceMesh.send({image:video});},width:640,height:480});
  mpCam.start();
}
function stopCam(vid){
  if(mpCam){mpCam.stop();mpCam=null;}
  const v=document.getElementById(vid);
  if(v&&v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null;}
  frameBuffer=[];holdCount=0;inferring=false;currentHandsData={};currentFaceData=null;
}

// ===== MediaPipe =====
function onFaceResults(r){
  if(!r.multiFaceLandmarks||!r.multiFaceLandmarks.length){currentFaceData=null;return;}
  const lm=r.multiFaceLandmarks[0];currentFaceData={};
  for(const k in FACE_POINTS){const i=FACE_POINTS[k];currentFaceData[k]={x:lm[i].x,y:lm[i].y,z:lm[i].z};}
}
function onHandResults(r){
  if(!document.getElementById('view-lesson').classList.contains('active'))return;
  const canvas=document.getElementById('canvas-lesson');
  const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);
  currentHandsData={};
  if(!r.multiHandLandmarks||!r.multiHandLandmarks.length){frameBuffer=[];holdCount=0;return;}
  for(let i=0;i<r.multiHandLandmarks.length;i++){
    const lm=r.multiHandLandmarks[i],side=r.multiHandedness[i].label;
    currentHandsData[side]=lm;
    drawConnectors(ctx,lm,HAND_CONNECTIONS,{color:'rgba(255,255,255,0.3)',lineWidth:2});
    drawLandmarks(ctx,lm,{color:side==='Right'?'#FFD60A':'#CE82FF',lineWidth:1,radius:3});
  }
  if(currentFaceData)FACE_KEYS.forEach(k=>{const p=currentFaceData[k];if(!p)return;ctx.beginPath();ctx.arc(p.x*canvas.width,p.y*canvas.height,4,0,Math.PI*2);ctx.fillStyle='#0071E3';ctx.fill();});
  frameBuffer.push(buildVec());
  if(frameBuffer.length>TARGET_FRAMES)frameBuffer.shift();
  if(frameBuffer.length===TARGET_FRAMES&&!answered)runInfer();
}

// ===== 特徴量 =====
function handVec(lm){const v=[];for(const p of lm)v.push(p.x,p.y,p.z);const w=lm[0],m=lm[9],dx=m.x-w.x,dy=m.y-w.y,dz=m.z-w.z;const dl=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;v.push(dx/dl,dy/dl,dz/dl);const p0=lm[0],p1=lm[5],p2=lm[17];const u=[p1.x-p0.x,p1.y-p0.y,p1.z-p0.z],t=[p2.x-p0.x,p2.y-p0.y,p2.z-p0.z];const nx=u[1]*t[2]-u[2]*t[1],ny=u[2]*t[0]-u[0]*t[2],nz=u[0]*t[1]-u[1]*t[0];const nl=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;v.push(nx/nl,ny/nl,nz/nl);return v;}
function distVec(lm,face){const w=lm[0];return FACE_KEYS.map(k=>{if(!face||!face[k])return 0;const p=face[k],dx=w.x-p.x,dy=w.y-p.y,dz=w.z-p.z;return Math.sqrt(dx*dx+dy*dy+dz*dz);});}
function buildVec(){const Z69=new Array(69).fill(0),Z6=new Array(6).fill(0),Z18=new Array(18).fill(0);const r=currentHandsData['Right']?handVec(currentHandsData['Right']):Z69.slice();const l=currentHandsData['Left']?handVec(currentHandsData['Left']):Z69.slice();let fv=Z18.slice();if(currentFaceData)FACE_KEYS.forEach((k,i)=>{const p=currentFaceData[k];if(p){fv[i*3]=p.x;fv[i*3+1]=p.y;fv[i*3+2]=p.z;}});const rd=currentHandsData['Right']?distVec(currentHandsData['Right'],currentFaceData):Z6.slice();const ld=currentHandsData['Left']?distVec(currentHandsData['Left'],currentFaceData):Z6.slice();return [...r,...l,...fv,...rd,...ld];}

// ===== 推論 =====
async function runInfer(){
  if(inferring)return;inferring=true;
  const t=new ort.Tensor('float32',Float32Array.from(frameBuffer.flat()),[1,TARGET_FRAMES,168]);
  try{
    const out=await ort_session.run({input:t});
    const lg=Array.from(out.output.data);
    const mx=Math.max(...lg);const ex=lg.map(v=>Math.exp(v-mx));const sm=ex.reduce((a,b)=>a+b,0);const pb=ex.map(v=>v/sm);
    const i=pb.indexOf(Math.max(...pb));const label=labels[i],conf=pb[i];
    const ok=label===currentChallenge&&conf>=CONF_THRESHOLD;
    document.getElementById('lesson-dot').className='detect-dot'+(conf>=CONF_THRESHOLD?(ok?' active':' wrong'):'');
    document.getElementById('lesson-label').textContent=conf>=0.35?label:'手をカメラに向けてください';
    document.getElementById('lesson-conf').textContent=conf>=0.35?Math.round(conf*100)+'%':'';
    document.getElementById('hold-fill').style.width=(holdCount/HOLD_FRAMES*100)+'%';
    if(ok){holdCount++;if(holdCount>=HOLD_FRAMES){answered=true;correctCount++;showFeedback(true);}}
    else holdCount=0;
  }catch(e){console.error(e);}
  inferring=false;
}

// ===== レッスン =====
async function startLesson(level){
  currentLevel=level;currentPhase=PHASE.LEARN;correctCount=0;answered=false;holdCount=0;
  learnQueue=[...level.words];
  reviewQueue=[...level.words,...level.words].sort(()=>Math.random()-0.5);
  currentIdx=0;
  showView('view-lesson');
  await startCam('video-lesson','canvas-lesson');
  nextChallenge();
}

function nextChallenge(){
  const queue=currentPhase===PHASE.LEARN?learnQueue:reviewQueue;
  if(currentIdx>=queue.length){
    if(currentPhase===PHASE.LEARN){
      currentPhase=PHASE.REVIEW;currentIdx=0;correctCount=0;
      document.getElementById('ls-phase-label').textContent='復習';
      document.getElementById('ls-prompt-label').textContent='復習テスト';
      nextChallenge();return;
    }else{endLesson();return;}
  }
  currentChallenge=queue[currentIdx];answered=false;holdCount=0;frameBuffer=[];
  document.getElementById('challenge-word').textContent=currentChallenge;
  document.getElementById('lesson-dot').className='detect-dot';
  document.getElementById('lesson-label').textContent='手をカメラに向けてください';
  document.getElementById('lesson-conf').textContent='';
  document.getElementById('hold-fill').style.width='0%';
  document.getElementById('ls-progress').style.width=(currentIdx/(currentPhase===PHASE.LEARN?learnQueue.length:reviewQueue.length)*100)+'%';
  document.getElementById('ls-phase-label').textContent=currentPhase===PHASE.LEARN?'学習':'復習';
  // 参考動画
  const src=currentLevel.videos&&currentLevel.videos[currentChallenge];
  const rv=document.getElementById('ref-video'),ph=document.getElementById('video-placeholder');
  if(src){rv.src=src;rv.style.display='block';ph.style.display='none';rv.load();}
  else{rv.style.display='none';ph.style.display='flex';}
  currentIdx++;
}

function showFeedback(correct){
  const fb=document.getElementById('feedback');
  fb.className='feedback-overlay show '+(correct?'correct':'wrong');
  document.getElementById('fb-title').textContent=correct?'正解！ 🎉':'もう一度！ 💪';
  document.getElementById('fb-sub').textContent=correct?`「${currentChallenge}」できました！`:`「${currentChallenge}」をもう一度`;
}

async function endLesson(){
  stopCam('video-lesson');
  const xp=correctCount*10;
  if(currentLevel)setClearedLevel(currentLevel.id);
  const stored=parseInt(localStorage.getItem('handit_xp')||'0');
  localStorage.setItem('handit_xp',stored+xp);
  document.getElementById('c-correct').textContent=correctCount;
  document.getElementById('c-xp').textContent='+'+xp;
  document.getElementById('complete-sub').textContent=`復習テスト ${reviewQueue.length}問中${correctCount}問正解！`;
  showView('view-complete');
}

function showView(id){
  const vl=document.getElementById('view-levels');
  if(vl)vl.style.display=id==='view-levels'?'block':'none';
  ['view-lesson','view-complete'].forEach(v=>{
    const el=document.getElementById(v);if(el)el.classList.toggle('active',v===id);
  });
}

document.getElementById('back-lesson').addEventListener('click',()=>{
  stopCam('video-lesson');
  document.getElementById('feedback').className='feedback-overlay';
  showView('view-levels');buildLevelList();
});
document.getElementById('fb-btn').addEventListener('click',()=>{
  document.getElementById('feedback').className='feedback-overlay';
  answered=false;holdCount=0;frameBuffer=[];nextChallenge();
});
document.getElementById('complete-back-btn').addEventListener('click',e=>{
  e.preventDefault();showView('view-levels');buildLevelList();
});

init();
</script>
</body>
</html>
