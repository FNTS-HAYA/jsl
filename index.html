<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB-YZ16629_Eadt8mu2kxtZU5ehZ9-dsGA",
  authDomain: "handit-a5cfa.firebaseapp.com",
  projectId: "handit-a5cfa",
  storageBucket: "handit-a5cfa.firebasestorage.app",
  messagingSenderId: "398275846471",
  appId: "1:398275846471:web:eb7571dcd1e920964d2c62"
};

const app      = initializeApp(firebaseConfig);
const auth     = getAuth(app);
const db       = getFirestore(app);
const provider = new GoogleAuthProvider();
let isRegisterMode = false;

// ユーザーデータをFirestoreから取得・初期化
async function loadUserData(uid) {
  const ref  = doc(db, 'users', uid);
  const snap = await getDoc(ref);
  if (snap.exists()) {
    return snap.data();
  } else {
    const defaultData = { xp:0, streak:0, cleared:[], createdAt: serverTimestamp() };
    await setDoc(ref, defaultData);
    return defaultData;
  }
}

// 認証状態の監視
onAuthStateChanged(auth, async user => {
  const userBar   = document.getElementById('user-bar');
  const loginBtns = document.getElementById('login-btns');
  if (user) {
    userBar.classList.remove('hidden');
    loginBtns.classList.add('hidden');
    document.getElementById('user-display-name').textContent = user.displayName || user.email;
    const avatar = document.getElementById('user-avatar');
    if (user.photoURL) {
      avatar.innerHTML = `<img src="${user.photoURL}" alt="avatar"/>`;
    } else {
      avatar.textContent = '🤟';
    }
    // Firestoreからデータ取得してUIに反映
    try {
      const data = await loadUserData(user.uid);
      document.getElementById('user-xp').textContent     = data.xp     || 0;
      document.getElementById('user-streak').textContent = data.streak  || 0;
      // learn.htmlで使えるようlocalStorageにも同期
      localStorage.setItem('handit_xp',      data.xp      || 0);
      localStorage.setItem('handit_streak',  data.streak  || 0);
      localStorage.setItem('handit_cleared', JSON.stringify(data.cleared || []));
      localStorage.setItem('handit_uid',     user.uid);
    } catch(e) { console.error('Firestore読み込みエラー:', e); }
  } else {
    userBar.classList.add('hidden');
    loginBtns.classList.remove('hidden');
    localStorage.removeItem('handit_uid');
  }
});

// Googleログイン
document.getElementById('google-login-btn').addEventListener('click', async () => {
  try { await signInWithPopup(auth, provider); } catch(e) { console.error(e); }
});

// メールモーダル
document.getElementById('email-login-btn').addEventListener('click', () => {
  isRegisterMode = false; updateEmailModal();
  document.getElementById('email-modal').classList.remove('hidden');
});
document.getElementById('email-modal-cancel').addEventListener('click', () => {
  document.getElementById('email-modal').classList.add('hidden'); clearError();
});
document.getElementById('email-modal-toggle').addEventListener('click', () => {
  isRegisterMode = !isRegisterMode; updateEmailModal();
});

function updateEmailModal() {
  document.getElementById('email-modal-title').textContent  = isRegisterMode ? '新規登録' : 'ログイン';
  document.getElementById('email-modal-sub').textContent    = isRegisterMode ? 'メールアドレスとパスワードを登録してください' : 'メールアドレスとパスワードを入力してください';
  document.getElementById('email-modal-submit').textContent = isRegisterMode ? '登録する' : 'ログイン';
  document.getElementById('email-modal-toggle').textContent = isRegisterMode ? 'すでにアカウントをお持ちの方' : '新規登録はこちら';
  clearError();
}
function clearError() { const e=document.getElementById('modal-error'); e.style.display='none'; e.textContent=''; }
function showError(msg){ const e=document.getElementById('modal-error'); e.textContent=msg; e.style.display='block'; }

document.getElementById('email-modal-submit').addEventListener('click', async () => {
  const email    = document.getElementById('modal-email').value.trim();
  const password = document.getElementById('modal-password').value;
  if (!email||!password) { showError('メールとパスワードを入力してください'); return; }
  try {
    if (isRegisterMode) {
      await createUserWithEmailAndPassword(auth, email, password);
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
    document.getElementById('email-modal').classList.add('hidden'); clearError();
  } catch(e) {
    const msgs = {
      'auth/email-already-in-use': 'このメールアドレスはすでに登録されています',
      'auth/invalid-email':        'メールアドレスの形式が正しくありません',
      'auth/weak-password':        'パスワードは6文字以上にしてください',
      'auth/user-not-found':       'アカウントが見つかりません',
      'auth/wrong-password':       'パスワードが間違っています',
      'auth/invalid-credential':   'メールアドレスまたはパスワードが間違っています',
    };
    showError(msgs[e.code] || 'エラーが発生しました');
  }
});

// ログアウト
document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

<title>HANDIT! — カメラの前で日本手話を練習する</title>

<style>
:root {
  --yellow:  #FFD60A;
  --yellow-d:#C8A800;
  --ink:     #101010;
  --ink-2:   #43433F;
  --ink-3:   #8E8E88;
  --rule:    #E4E2DC;
  --paper:   #FFFFFF;
  --panel:   #131312;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Zen Kaku Gothic New', -apple-system, 'Helvetica Neue', sans-serif;
  background: var(--paper); color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-weight: 500;
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--yellow-d); outline-offset: 3px; border-radius: 4px; }

.wrap { max-width: 1120px; margin: 0 auto; padding: 0 32px; }
@media (max-width: 640px) { .wrap { padding: 0 20px; } }

/* ===== ヘッダ ===== */
.bar {
  position: sticky; top: 0; z-index: 60;
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--rule);
}
.bar-in { display: flex; align-items: center; gap: 24px; height: 60px; }
.bar-logo { height: 22px; }
.bar-nav { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.bar-nav a {
  font-size: 14px; font-weight: 700; color: var(--ink-2);
  text-decoration: none; padding: 8px 12px; border-radius: 8px;
}
.bar-nav a:hover { background: #F2F1EC; color: var(--ink); }
.bar-nav .go {
  background: var(--ink); color: #fff; padding: 9px 18px; border-radius: 99px; margin-left: 6px;
}
.bar-nav .go:hover { background: #2C2C2A; color: #fff; }
@media (max-width: 560px) { .bar-nav a:not(.go) { display: none; } }

/* ===== ヒーロー ===== */
.hero { padding: 84px 0 72px; }
.hero-in { display: grid; grid-template-columns: 1fr 340px; gap: 64px; align-items: center; }
@media (max-width: 860px) { .hero { padding: 48px 0 52px; } .hero-in { grid-template-columns: 1fr; gap: 36px; } }

.hero h1 {
  font-size: clamp(34px, 5.4vw, 60px);
  font-weight: 900; line-height: 1.22; letter-spacing: -0.02em;
}
/* 大胆さはここ1箇所だけ: 手書きロゴに合わせた蛍光ペンの線 */
.mark {
  background: linear-gradient(transparent 62%, var(--yellow) 62%, var(--yellow) 94%, transparent 94%);
  background-size: 0% 100%; background-repeat: no-repeat;
  animation: draw 0.75s cubic-bezier(0.22,1,0.36,1) 0.55s forwards;
}
@keyframes draw { to { background-size: 100% 100%; } }

.hero p {
  margin-top: 22px; font-size: 17px; line-height: 1.95;
  color: var(--ink-2); max-width: 34em;
}
.hero-cta { margin-top: 34px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn {
  display: inline-block; text-decoration: none; cursor: pointer;
  font-family: inherit; font-size: 16px; font-weight: 700;
  padding: 15px 32px; border-radius: 99px; border: none;
}
.btn-fill { background: var(--ink); color: #fff; }
.btn-fill:hover { background: #2C2C2A; }
.btn-line { border: 1.5px solid var(--rule); color: var(--ink); background: none; }
.btn-line:hover { border-color: var(--ink-3); }
.hero-note { margin-top: 20px; font-size: 13px; color: var(--ink-3); line-height: 1.8; }

/* 手話のプレビュー */
.demo { justify-self: end; width: 100%; max-width: 340px; }
@media (max-width: 860px) { .demo { justify-self: start; } }
.demo-frame {
  border: 1.5px solid var(--rule); border-radius: 20px; overflow: hidden;
  background: var(--panel);
}
.demo-media { aspect-ratio: 3/4; position: relative; background: var(--panel); }
.demo-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.demo-fallback {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px; color: #4A4A46; font-size: 13px;
}
.demo-tag {
  position: absolute; left: 12px; top: 12px;
  background: rgba(0,0,0,0.55); color: #fff; backdrop-filter: blur(6px);
  border-radius: 99px; padding: 5px 13px; font-size: 12px; font-weight: 700;
}
.demo-read {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 16px; background: #1C1C1A; border-top: 1px solid #2A2A27;
}
.demo-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--yellow); flex-shrink: 0; }
.demo-word { font-size: 16px; font-weight: 700; color: #fff; flex: 1; }
.demo-pct { font-size: 13px; font-weight: 700; color: var(--yellow); }

/* 64フレームのバッファ = このアプリ固有の視覚単位 */
.strip { display: flex; gap: 2px; margin-top: 12px; height: 22px; }
.strip i {
  flex: 1; background: var(--rule); border-radius: 1.5px;
  transform: scaleY(0.35); transform-origin: bottom;
  animation: fill 0.5s ease forwards;
}
@keyframes fill { to { background: var(--yellow); transform: scaleY(1); } }
.strip-label { margin-top: 8px; font-size: 11.5px; color: var(--ink-3); }

@media (prefers-reduced-motion: reduce) {
  .mark { background-size: 100% 100%; animation: none; }
  .strip i { animation: none; background: var(--yellow); transform: scaleY(1); }
  * { transition: none !important; }
}

/* ===== 使い方 ===== */
.band { border-top: 1px solid var(--rule); padding: 72px 0; }
.band h2 {
  font-size: clamp(24px, 3.4vw, 34px); font-weight: 900;
  letter-spacing: -0.01em; line-height: 1.35;
}
.band-lead { margin-top: 12px; font-size: 16px; color: var(--ink-2); line-height: 1.9; max-width: 40em; }

.steps { margin-top: 40px; border-top: 1px solid var(--rule); }
.step {
  display: grid; grid-template-columns: 52px 1fr; gap: 22px;
  padding: 26px 0; border-bottom: 1px solid var(--rule); align-items: start;
}
.step-n {
  font-size: 15px; font-weight: 900; color: var(--ink);
  width: 34px; height: 34px; border-radius: 50%; background: var(--yellow);
  display: flex; align-items: center; justify-content: center;
}
.step-t { font-size: 18px; font-weight: 700; }
.step-b { margin-top: 6px; font-size: 15px; color: var(--ink-2); line-height: 1.85; max-width: 46em; }

/* ===== しくみ ===== */
.tech { background: var(--panel); color: #fff; padding: 76px 0; }

.tech .band-lead { color: rgba(255,255,255,0.62); }

.pipe { margin-top: 44px; display: flex; gap: 0; flex-wrap: wrap; }

  flex: 1; min-width: 170px; padding: 22px 22px 22px 0;

.pipe-v { margin-top: 8px; font-size: 15px; font-weight: 700; color: #fff; line-height: 1.5; }
.pipe-d { margin-top: 6px; font-size: 13px; color: rgba(255,255,255,0.55); line-height: 1.75; }

.tech-notes { margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap: 28px; }
.tech-note-t { font-size: 15px; font-weight: 700; }
.tech-note-b { margin-top: 7px; font-size: 14px; color: rgba(255,255,255,0.58); line-height: 1.85; }

/* ===== 記録 ===== */
.record { display: flex; gap: 0; margin-top: 36px; border-top: 1px solid var(--rule); flex-wrap: wrap; }
.record-cell { flex: 1; min-width: 120px; padding: 24px 24px 24px 0; }
.record-n { font-size: 42px; font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
.record-l { margin-top: 8px; font-size: 13px; color: var(--ink-3); font-weight: 700; }

/* ===== 入口 ===== */
.doors { margin-top: 40px; display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 560px; }
.door {
  display: block; text-decoration: none;
  border: 1.5px solid var(--rule); border-radius: 20px; padding: 28px;

.door:hover { border-color: var(--ink); background: #FAFAF8; }
.door-t { font-size: 19px; font-weight: 900; }
.door-b { margin-top: 8px; font-size: 14.5px; color: var(--ink-2); line-height: 1.85; }

<script type="module">
// ---- 64フレームのストリップ（読み込み時に1回だけ流れる） ----
const strip = document.getElementById('strip');
const N = 32;                                   // 見た目の分割数（実際のバッファは64フレーム）
for (let i = 0; i < N; i++) {
  const c = document.createElement('i');
  c.style.animationDelay = (0.6 + i * 0.022) + 's';
  strip.appendChild(c);
}

// ---- 記録 ----
document.getElementById('stat-xp').textContent = localStorage.getItem('handit_xp') || 0;
document.getElementById('stat-cleared').textContent =
  JSON.parse(localStorage.getItem('handit_cleared') || '[]').length;

// AIが今いくつの単語を判定できるか（学習済み + スタジオで即席登録した分）
(async () => {
  let trained = [];
  try { trained = (await fetch('dataset/labels.json').then(r => r.json())).labels || []; } catch {}
  let proto = [];
  try { proto = Object.keys(JSON.parse(localStorage.getItem('handit_prototypes') || '{}')); } catch {}
  const n = new Set([...trained, ...proto]).size;
  document.getElementById('stat-words').textContent = n || '—';
})();

// ---- 初回はチュートリアルへ ----
function goLearn(e) {
  e.preventDefault();
  location.href = localStorage.getItem('handit_tutorial_done') ? 'learn.html' : 'tutorial.html';
}
document.getElementById('go-top').addEventListener('click', goLearn);
